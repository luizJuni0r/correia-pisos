<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <title>Home</title>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <script type="module" src="js/pages/index.js"></script>

    <link rel="stylesheet" href="css/base.css"/>
    <link rel="stylesheet" href="css/paginas/index.css"/>
    <link rel="stylesheet" href="css/componentes/card.css"/>
  </head>

  <body>
    <header>
      <img src="assets/logo.svg" alt="Logo Correia Pisos" />
    </header>

    <section>
      <span>Bem-vindo!</span>
      <h1>O que deseja fazer hoje?</h1>
    </section>

    <main>
      <a href="#" class="card card--interativo">
        <img src="img/orcamento.svg" alt="" />

        <div>
          <h2>Novo Orçamento</h2>
          <p>Crie um novo orçamento de forma rápida</p>
        </div>
      </a>

      <a href="#" class="card card--interativo">
        <img src="img/produtos.svg" alt="" />

        <div>
          <h2>Produtos</h2>
          <p>Consulte e gerencie os produtos</p>
        </div>
      </a>

      <a href="#" class="card card--interativo">
        <img src="img/historico.svg" alt="" />

        <div>
          <h2>Histórico de Orçamentos</h2>
          <p>Veja orçamentos anteriores</p>
        </div>
      </a>

      <a href="#" class="card card--interativo">
        <img src="img/configuracoes.svg" alt="" />

        <div>
          <h2>Configurações</h2>
          <p>Ajustes do sistema e preferências</p>
        </div>
      </a>

      <a href="#" class="card card--interativo">
        <img  src="img/relatorios.svg" alt="" />

        <div>
          <h2>Relatórios</h2>
          <p>Acesse relatórios e indicadores</p>
        </div>
      </a>
    </main>
  </body>
</html>
